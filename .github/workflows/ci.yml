name: tests + validate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests (exact enumeration, King Wen vectors, routing)
        run: node --test
      - name: Validate data
        run: node scripts/validate.mjs --require zh,legge,poem
      - name: Verify font subset coverage
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 scripts/build-fonts.py --check
